# inventory.ini - lists the devices Ansible knows about.
# We group them so we *could* target routers or switches separately,
# but rendering runs against all of them.
#
# connection=local + a localhost-style setup means Ansible does NOT SSH to
# these devices here - we are only generating config files on our own machine.

[routers]
R1 ansible_host=192.168.0.191
R2 ansible_host=

[switches]
SW1 ansible_host=
SW2 ansible_host=

[network:children]
routers
switches

[network:vars]
ansible_user=admin
ansible_password=cisco
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios

